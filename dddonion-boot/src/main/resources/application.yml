spring:
  reactor:
    # restores Reactor-context values (use case, actor type, correlation id) as ThreadLocals/MDC on every operator
    context-propagation: auto
  webflux:
    problemdetails:
      enabled: true

  r2dbc:
    url: r2dbc:mariadb://localhost:3306/shop
    username: shop
    password: shop
    pool:
      enabled: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.sql
    url: jdbc:mariadb://localhost:3306/shop
    user: shop
    password: shop
    driver-class-name: org.mariadb.jdbc.Driver

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: "r2dbc"
        liveness:
          include: "ping"

logging:
  level:
    org.springframework.r2dbc: warn
  pattern:
    # use-case context of the current call (empty outside a use case)
    level: "%5p [%X{usecase:-}|%X{actorType:-}|%X{correlationId:-}]"

---
# JSON logs for log shippers (Loki etc.): MDC and SLF4J key-values (incl. the 'audit' logger) become fields.
spring:
  config:
    activate:
      on-profile: json-logs
logging:
  structured:
    format:
      console: ecs
