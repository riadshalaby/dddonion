spring:
  reactor:
    # stellt Werte aus dem Reactor-Context (Use Case, Actor-Typ, Correlation-ID) bei jedem Operator als ThreadLocals/MDC wieder her
    context-propagation: auto
  webflux:
    problemdetails:
      enabled: true

  r2dbc:
    url: r2dbc:mariadb://localhost:3306/shop
    username: shop
    password: shop
    pool:
      enabled: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.sql
    url: jdbc:mariadb://localhost:3306/shop
    user: shop
    password: shop
    driver-class-name: org.mariadb.jdbc.Driver

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: "r2dbc"
        liveness:
          include: "ping"

logging:
  level:
    org.springframework.r2dbc: warn
  pattern:
    # Use-Case-Kontext des aktuellen Aufrufs (leer außerhalb eines Use Cases)
    level: "%5p [%X{usecase:-}|%X{actorType:-}|%X{correlationId:-}]"

---
# JSON-Logs für Log-Shipper (Loki usw.): MDC und SLF4J-Key-Values (inkl. Logger 'audit') werden zu Feldern.
spring:
  config:
    activate:
      on-profile: json-logs
logging:
  structured:
    format:
      console: ecs
