openapi: 3.0.3
info:
  title: dddonion API
  version: 1.0.0
  description: >
    Design-first REST contract for the dddonion example. This YAML is the single
    source of truth for the HTTP interface; the Spring WebFlux controller
    implements the interface generated from it.
  license:
    name: MIT License
    url: https://opensource.org/license/mit/
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Orders
    description: Placing customer orders
  - name: Customers
    description: Registering customers and managing their credit limit
paths:
  /orders:
    post:
      tags:
        - Orders
      operationId: placeOrder
      summary: Place a new order
      description: >
        Creates a new order for the given customer and total amount, provided the
        customer exists and the order fits into the remaining credit limit
        (open amount + total <= credit limit). Returns the identifier of the created order.
      parameters:
        - $ref: '#/components/parameters/ActorTypeHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: The order was created.
          headers:
            Location:
              description: URI of the newly created order.
              schema:
                type: string
                format: uri
              example: /orders/3f6a9c1e-4b2d-4f0a-9c7e-8a1b2c3d4e5f
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: >
            The request was rejected, e.g. a malformed customer id or a
            negative total.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: The customer is unknown or the order would exceed the customer's credit limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /orders/{orderId}:
    get:
      tags:
        - Orders
      operationId: getOrder
      summary: Get an order by id
      description: Returns the current state of the order with the given identifier.
      parameters:
        - name: orderId
          in: path
          required: true
          description: Identifier of the order.
          schema:
            $ref: '#/components/schemas/OrderId'
        - $ref: '#/components/parameters/ActorTypeHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: The order was found.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderView'
        '400':
          description: The request was rejected, e.g. a malformed id or an unknown actor type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No order exists with the given identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /customers:
    post:
      tags:
        - Customers
      operationId: registerCustomer
      summary: Register a new customer
      description: >
        Registers a customer with a unique e-mail address and an initial credit limit.
        Returns the identifier of the created customer.
      parameters:
        - $ref: '#/components/parameters/ActorTypeHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCustomerRequest'
      responses:
        '201':
          description: The customer was registered.
          headers:
            Location:
              description: URI of the newly registered customer.
              schema:
                type: string
                format: uri
              example: /customers/3f6a9c1e-4b2d-4f0a-9c7e-8a1b2c3d4e5f
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          description: The request was rejected, e.g. an invalid e-mail address or a negative credit limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: The e-mail address is already registered.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /customers/{customerId}:
    get:
      tags:
        - Customers
      operationId: getCustomer
      summary: Get a customer by id
      description: Returns the current state of the customer with the given identifier.
      parameters:
        - name: customerId
          in: path
          required: true
          description: Identifier of the customer.
          schema:
            $ref: '#/components/schemas/CustomerId'
        - $ref: '#/components/parameters/ActorTypeHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      responses:
        '200':
          description: The customer was found.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerView'
        '400':
          description: The request was rejected, e.g. a malformed id or an unknown actor type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No customer exists with the given identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /customers/{customerId}/credit-limit:
    put:
      tags:
        - Customers
      operationId: changeCreditLimit
      summary: Change the credit limit of a customer
      description: >
        Replaces the credit limit. The new limit may be below the currently open amount;
        it then merely blocks further orders.
      parameters:
        - name: customerId
          in: path
          required: true
          description: Identifier of the customer.
          schema:
            $ref: '#/components/schemas/CustomerId'
        - $ref: '#/components/parameters/ActorTypeHeader'
        - $ref: '#/components/parameters/CorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeCreditLimitRequest'
      responses:
        '204':
          description: The credit limit was changed.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '400':
          description: The request was rejected, e.g. a malformed id or a negative credit limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: No customer exists with the given identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: The customer was modified concurrently and retries were exhausted; the request may be repeated.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  parameters:
    # --- Use-case metadata: who (classified) triggers a use case, correlated across logs and events. ---
    ActorTypeHeader:
      name: X-Actor-Type
      in: header
      required: false
      description: >
        Business classification of the caller. Self-declared by the client, so it is used for
        analytics only, never for authorization. Omitted means UNKNOWN.
      schema:
        $ref: '#/components/schemas/ActorType'
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: Correlates all logs and events of one call. Generated by the server when omitted.
      schema:
        $ref: '#/components/schemas/CorrelationId'
  headers:
    CorrelationId:
      description: The correlation id used for this call (echoed or generated).
      schema:
        $ref: '#/components/schemas/CorrelationId'
  schemas:
    ActorType:
      type: string
      description: Business classification of the caller (mirrors the application ActorType without UNKNOWN).
      enum:
        - PRIVATE_CUSTOMER
        - BUSINESS_CUSTOMER
        - EXTERNAL_ERP
      example: PRIVATE_CUSTOMER
    CorrelationId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9._:-]+$'
      description: Restricted charset keeps the value safe to write into logs.
      example: 7d1c2b3a-checkout-42
    # --- Reusable, self-contained scalar types (single source of truth on the wire). ---
    # Each mirrors a domain value object; the value-based drift test asserts they agree.
    OrderId:
      type: string
      minLength: 36
      maxLength: 36
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      description: Canonical UUID identifier of an order.
      example: 3f6a9c1e-4b2d-4f0a-9c7e-8a1b2c3d4e5f
    CustomerId:
      type: string
      minLength: 36
      maxLength: 36
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      description: Canonical UUID identifier of a customer.
      example: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
    CustomerEmail:
      type: string
      format: email
      maxLength: 254
      pattern: '^[A-Za-z0-9][A-Za-z0-9+._-]*[A-Za-z0-9]@[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)*\.[A-Za-z]{2,}$|^[A-Za-z0-9]@[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)*\.[A-Za-z]{2,}$'
      description: Customer's e-mail address.
      example: test@example.com
    MonetaryAmount:
      type: number
      minimum: 0
      description: A non-negative monetary amount.
      example: 12.34
    PlaceOrderRequest:
      type: object
      required:
        - customerId
        - total
      properties:
        customerId:
          $ref: '#/components/schemas/CustomerId'
        total:
          $ref: '#/components/schemas/MonetaryAmount'
    OrderResponse:
      type: object
      required:
        - orderId
      properties:
        orderId:
          $ref: '#/components/schemas/OrderId'
    OrderView:
      type: object
      required:
        - orderId
        - customerId
        - total
        - status
      properties:
        orderId:
          $ref: '#/components/schemas/OrderId'
        customerId:
          $ref: '#/components/schemas/CustomerId'
        total:
          $ref: '#/components/schemas/MonetaryAmount'
        status:
          type: string
          description: Current lifecycle state of the order.
          enum:
            - NEW
            - PLACED
            - PAID
          example: PLACED
    RegisterCustomerRequest:
      type: object
      required:
        - email
        - creditLimit
      properties:
        email:
          $ref: '#/components/schemas/CustomerEmail'
        creditLimit:
          $ref: '#/components/schemas/MonetaryAmount'
    CustomerResponse:
      type: object
      required:
        - customerId
      properties:
        customerId:
          $ref: '#/components/schemas/CustomerId'
    CustomerView:
      type: object
      required:
        - customerId
        - email
        - creditLimit
        - openAmount
      properties:
        customerId:
          $ref: '#/components/schemas/CustomerId'
        email:
          $ref: '#/components/schemas/CustomerEmail'
        creditLimit:
          $ref: '#/components/schemas/MonetaryAmount'
        openAmount:
          $ref: '#/components/schemas/MonetaryAmount'
    ChangeCreditLimitRequest:
      type: object
      required:
        - creditLimit
      properties:
        creditLimit:
          $ref: '#/components/schemas/MonetaryAmount'
    ProblemDetail:
      type: object
      description: RFC 7807 problem details.
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
          example: Customer email must be a valid email address
        instance:
          type: string
          format: uri
          example: /orders
