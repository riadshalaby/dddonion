openapi: 3.0.3
info:
  title: dddonion Orders API
  version: 1.0.0
  description: >
    Design-first REST contract for the dddonion example. This YAML is the single
    source of truth for the HTTP interface; the Spring WebFlux controller
    implements the interface generated from it.
  license:
    name: MIT License
    url: https://opensource.org/license/mit/
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Orders
    description: Placing customer orders
paths:
  /orders:
    post:
      tags:
        - Orders
      operationId: placeOrder
      summary: Place a new order
      description: >
        Creates a new order for the given customer e-mail and total amount.
        Returns the identifier of the created order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: The order was created.
          headers:
            Location:
              description: URI of the newly created order.
              schema:
                type: string
                format: uri
              example: /orders/3f6a9c1e-4b2d-4f0a-9c7e-8a1b2c3d4e5f
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: >
            The request was rejected, e.g. an invalid e-mail address or a
            negative total.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /orders/{orderId}:
    get:
      tags:
        - Orders
      operationId: getOrder
      summary: Get an order by id
      description: Returns the current state of the order with the given identifier.
      parameters:
        - name: orderId
          in: path
          required: true
          description: Identifier of the order.
          schema:
            type: string
      responses:
        '200':
          description: The order was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderView'
        '404':
          description: No order exists with the given identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
components:
  schemas:
    PlaceOrderRequest:
      type: object
      required:
        - customerEmail
        - total
      properties:
        customerEmail:
          type: string
          format: email
          maxLength: 254
          description: Customer's e-mail address.
          example: test@example.com
        total:
          type: number
          minimum: 0
          description: Order total; must be greater than or equal to zero.
          example: 12.34
    OrderResponse:
      type: object
      required:
        - orderId
      properties:
        orderId:
          type: string
          description: Identifier of the newly created order.
          example: 3f6a9c1e-4b2d-4f0a-9c7e-8a1b2c3d4e5f
    OrderView:
      type: object
      required:
        - orderId
        - customerEmail
        - total
        - status
      properties:
        orderId:
          type: string
          example: 3f6a9c1e-4b2d-4f0a-9c7e-8a1b2c3d4e5f
        customerEmail:
          type: string
          format: email
          example: test@example.com
        total:
          type: number
          example: 12.34
        status:
          type: string
          description: Current lifecycle state of the order.
          enum:
            - NEW
            - PLACED
            - PAID
          example: PLACED
    ProblemDetail:
      type: object
      description: RFC 7807 problem details.
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
          example: Customer email must be a valid email address
        instance:
          type: string
          format: uri
          example: /orders
